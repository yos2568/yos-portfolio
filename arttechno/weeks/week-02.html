    <h2>0. รู้จักคำสำคัญก่อนเริ่ม</h2>
    <div class="lesson-grid">
      <article class="learning-card">
        <span class="term-label">Ollama</span>
        <h3>โปรแกรมเรียกใช้ AI ในเครื่อง</h3>
        <p>Ollama เป็นโปรแกรมที่ดาวน์โหลดและรันโมเดลภาษาบน PC ของเรา เมื่อรันแบบ local ข้อความจะถูกประมวลผลบนเครื่อง ไม่ใช่ส่งไปให้โมเดล cloud โดยอัตโนมัติ</p>
      </article>
      <article class="learning-card">

        <p>โมเดลคือไฟล์ AI ที่เลือกใช้ เช่น รุ่นเล็กสำหรับเครื่องทั่วไป รุ่นที่ช่วยคิดเชิงตรรกะ หรือรุ่นที่อ่านภาพได้ รุ่นใหญ่กว่าอาจเก่งขึ้น แต่ใช้พื้นที่และหน่วยความจำมากขึ้น</p>
      </article>
      <article class="learning-card">
        <span class="term-label">PowerShell</span>
        <h3>หน้าต่างสั่ง Windows และ Ollama</h3>
        <p>ใช้พิมพ์คำสั่งสั้น ๆ เพื่อเช็ก ติดตั้ง ดาวน์โหลด หรือเปิดโมเดล ไม่ใช่พื้นที่สำหรับวาง prompt ยาว ๆ</p>
      </article>

    <h2>1. Agentic workflow คืออะไร</h2>
    <p><strong>Chatbot</strong> ตอบข้อความครั้งต่อครั้ง ส่วน <strong>agentic workflow</strong> แบ่งงานเป็นขั้น ใช้เครื่องมือหรือเอกสารตามสิทธิ์ที่ได้รับ ตรวจผล แล้วรายงานสิ่งที่เกิดขึ้น คาบนี้ใช้แบบ <strong>human-in-the-loop</strong>: AI ไม่มีสิทธิ์ลบไฟล์ ส่งอีเมล ซื้อของ หรือเผยแพร่สิ่งใดเอง</p>
    <div class="agent-flow" aria-label="ลำดับเวิร์กโฟลว์แบบตัวแทน">
      <article><span>1</span><strong>Goal</strong><p>เป้าหมายชัด</p></article>
      <article><span>2</span><strong>Plan</strong><p>AI เสนอขั้นตอน</p></article>
      <article><span>3</span><strong>Approve</strong><p>มนุษย์เลือก/อนุมัติ</p></article>
      <article><span>4</span><strong>Act</strong><p>ทำเฉพาะขั้นที่อนุญาต</p></article>
      <article><span>5</span><strong>Verify</strong><p>ตรวจผลกับหลักฐานจริง</p></article>
      <article><span>6</span><strong>Log &amp; revise</strong><p>บันทึกและปรับรอบต่อไป</p></article>
    </div>
    <aside class="lesson-rule" aria-label="ขอบเขตการใช้ agent">
      <p><strong>ขอบเขตของคาบ:</strong> งาน agentic ทุกชิ้นต้องมีจุดที่มนุษย์ตรวจและอนุมัติ ห้ามเปิดสิทธิ์ “ทำทุกอย่างอัตโนมัติ” และห้ามให้ AI ดำเนินการกับไฟล์ บัญชี หรือข้อมูลของผู้อื่นโดยไม่เข้าใจผล</p>
    </aside>

3) บอกจุดที่ฉันต้องตรวจหรืออนุมัติก่อนทำต่อ

หยุดและรอให้ฉันตอบว่า APPROVE STEP [หมายเลข] ก่อนทำขั้นนั้น</code></pre>
      <p class="card-note"><strong>ใช้จริง:</strong> อ่านแผนก่อนอนุมัติทุกครั้ง หลังจบแต่ละขั้น ให้ขอหลักฐานหรือสรุปสิ่งที่เปลี่ยน แล้วบันทึกการตัดสินใจของคุณ</p>
    </article>

    <h2>7. เลือก mini-project แบบ agentic</h2>
    <p>ทำคนเดียวหรือเป็นคู่ เลือกหนึ่งโครงการด้านล่าง ใช้ prompt อย่างน้อย 3 รอบ และทำ agent log: เป้าหมาย → แผนที่ AI เสนอ → สิ่งที่คุณอนุมัติ → ผลที่ตรวจ → สิ่งที่แก้</p>
    <div class="project-grid">
      <article class="learning-card"><span class="term-label">Project 01</span><h3>Music Practice Coach</h3><p>ทำแผนฝึก 7 วันสำหรับเป้าหมายจริง พร้อมสิ่งที่ต้องวัดและสิ่งที่ไม่ควรทำเกินเวลา</p></article>
      <article class="learning-card"><span class="term-label">Project 02</span><h3>Micro-teaching Kit</h3><p>ออกแบบกิจกรรมสอน 15 นาที พร้อมคำถามชวนคิดและวิธีเช็กความเข้าใจ</p></article>
      <article class="learning-card"><span class="term-label">Project 03</span><h3>Research Starter Agent</h3><p>สร้างคำถามวิจัย คำค้น และ checklist ประเมินแหล่งข้อมูล โดยคุณเป็นผู้เปิดและตรวจแหล่งจริง</p></article>
      <article class="learning-card"><span class="term-label">Project 04</span><h3>Artwork Concept Pack</h3><p>พัฒนาแนวคิดงานศิลปะ 3 ทาง พร้อมวัสดุ ประสบการณ์ผู้ชม และข้อควรระวังเชิงจริยธรรม</p></article>
      <article class="learning-card"><span class="term-label">Project 05</span><h3>Study Guide</h3><p>เปลี่ยนโน้ตที่คุณเขียนเองเป็นคำศัพท์ flashcards และแบบทดสอบที่ตรวจความเข้าใจ</p></article>
      <article class="learning-card"><span class="term-label">Project 06</span><h3>Event Planner Agent</h3><p>วางโครงกิจกรรมดนตรี/ศิลปะเล็ก ๆ: เป้าหมาย กลุ่มผู้ชม งานที่ต้องทำ ความเสี่ยง และจุดอนุมัติ</p></article>
    </div>

    <h2>8. AI ช่วยอะไรได้ · และอะไรที่ต้องเป็นมนุษย์</h2>
    <div class="lesson-grid">
      <article class="learning-card">
        <span class="term-label">AI ช่วยได้</span>
        <h3>ร่าง · วางแผน · จัดระบบ · ตรวจตาม checklist</h3>
        <p>ช่วยสรุปโน้ต ร่างตารางฝึก เขียนคำถามสอน แตกคำค้น เปรียบเทียบแนวคิดงานศิลปะ ปรับภาษา และเสนอขั้นตอนทำงานได้</p>
      </article>
      <article class="learning-card">
        <span class="term-label">มนุษย์ต้องรับผิดชอบ</span>
        <h3>อนุมัติ · ตรวจความจริง · ตัดสินใจ · รับผิดชอบผล</h3>
        <p>คุณต้องอนุมัติแต่ละขั้น ตรวจแหล่งข้อมูล ฟังและตัดสินใจเรื่องดนตรี ดูความเหมาะสมกับผู้เรียน เคารพลิขสิทธิ์ และไม่ส่งคำตอบ AI ทั้งก้อนเป็นงานของตนเอง</p>
      </article>
      <article class="learning-card">
        <span class="term-label">อย่าใช้เป็น</span>
        <h3>แพทย์ ทนาย หรือแหล่งอ้างอิงสุดท้าย</h3>
        <p>อย่าพึ่งพา AI สำหรับคำแนะนำสุขภาพ กฎหมาย การเงิน หรือข้อเท็จจริงสำคัญโดยไม่ตรวจผู้เชี่ยวชาญและแหล่งที่น่าเชื่อถือ</p>
      </article>
      <article class="learning-card">
        <span class="term-label">Local ≠ perfect privacy</span>
        <h3>ข้อมูลอยู่ในเครื่อง แต่ยังต้องคิดก่อนแชร์</h3>
        <p>การรัน local ลดการส่งข้อความไปบริการ cloud แต่ไม่ควรวางข้อมูลส่วนตัวของผู้อื่น งานลับ หรือเนื้อหาที่ไม่มีสิทธิ์เผยแพร่ลงในระบบโดยไม่จำเป็น</p>
      </article>
    </div>

    <h2>9. คำสั่งดูแลโมเดลหลังจบคาบ</h2>
    <p>คำสั่งเหล่านี้ใช้ใน PowerShell <strong>หลังออกจาก chat</strong> ใช้เฉพาะเมื่อเข้าใจผลที่จะเกิดขึ้น โดยเฉพาะการลบโมเดล</p>
    <div class="lesson-grid">
      <article class="copy-card command-card">
        <div class="copy-card-top"><div><span class="card-label">Command card</span><h3>ดูรายชื่อโมเดล</h3></div><button class="copy-card-button" type="button" data-copy-card>คัดลอก</button></div>
        <pre data-copy-source><code>ollama ls</code></pre>
        <p class="card-note">แสดงโมเดลที่ดาวน์โหลดไว้</p>
      </article>
      <article class="copy-card command-card">
        <div class="copy-card-top"><div><span class="card-label">Command card</span><h3>ดูโมเดลที่กำลังทำงาน</h3></div><button class="copy-card-button" type="button" data-copy-card>คัดลอก</button></div>
        <pre data-copy-source><code>ollama ps</code></pre>
        <p class="card-note">ดูว่า model ใดยังใช้หน่วยความจำอยู่</p>
      </article>
      <article class="copy-card command-card">
        <div class="copy-card-top"><div><span class="card-label">Command card</span><h3>หยุดโมเดล</h3></div><button class="copy-card-button" type="button" data-copy-card>คัดลอก</button></div>
        <pre data-copy-source><code>ollama stop llama3.2:1b</code></pre>
        <p class="card-note">เปลี่ยนชื่อโมเดลให้ตรงกับโมเดลที่คุณกำลังใช้</p>
      </article>
      <article class="copy-card command-card">
        <div class="copy-card-top"><div><span class="card-label">Command card · ระวัง</span><h3>ลบโมเดลเพื่อคืนพื้นที่</h3></div><button class="copy-card-button" type="button" data-copy-card>คัดลอก</button></div>
        <pre data-copy-source><code>ollama rm llama3.2:1b</code></pre>
        <p class="card-note">ลบไฟล์โมเดลจากเครื่อง ต้องดาวน์โหลดใหม่หากต้องการใช้ภายหลัง</p>
      </article>

    <h2>10. ถ้าเจอปัญหา</h2>
    <div class="details-stack">
      <details>
        <summary>พิมพ์คำสั่งแล้วขึ้นว่าไม่รู้จัก Ollama</summary>
        <p>ปิด PowerShell แล้วเปิดใหม่ก่อน หากยังไม่สำเร็จ ให้เปิด Ollama จาก Start menu หรือเรียก TA ตรวจการติดตั้ง อย่าดาวน์โหลดตัวติดตั้งซ้ำหลายรอบ</p>
      </details>
      <details>
        <summary>ดาวน์โหลดโมเดลช้า หรือเครื่องดูเหมือนค้าง</summary>
        <p>โมเดลเป็นไฟล์ขนาดใหญ่ ให้ดูว่ายังมีแถบความคืบหน้าหรือไม่ รอและแจ้ง TA หากหยุดนานผิดปกติ อย่ากดดาวน์โหลดโมเดลใหม่ซ้อนกัน</p>
      </details>
      <details>
        <summary>คำตอบของ AI ผิด หรือไม่ทำตามรูปแบบที่ขอ</summary>
        <p>อย่าเพิ่งเชื่อหรือคัดลอก ให้เติมบริบท ระบุข้อจำกัด และบอกรูปแบบผลลัพธ์อีกครั้ง จากนั้นตรวจคำตอบด้วยตนเองหรือแหล่งจริง</p>
      </details>
      <details>
        <summary>พื้นที่ดิสก์ไม่พอ</summary>
        <p>ใช้โมเดลเล็กที่สุดที่อาจารย์อนุญาต หรือให้ TA ดูแลการลบโมเดลเก่าที่ไม่จำเป็น ห้ามลบไฟล์ของผู้อื่นหรือไฟล์ระบบ</p>
      </details>
    </div>
