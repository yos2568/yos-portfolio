  <h2 id="2-ai-คืออะไร-แบบเข้าใจง่าย">2. AI คืออะไร? (แบบเข้าใจง่าย)</h2>
  <h3 id="21-สองทางที่คอมพิวเตอร์-ทำงานฉลาด">2.1 สองทางที่คอมพิวเตอร์
  “ทำงานฉลาด”</h3>

  <table>
  <thead>

  </tr>

  </tr>

  <tr>

  </table>

  “เรียนรู้จากข้อมูล”?<br />
  ตัวอย่างคำตอบ: ไฟแดง = กฎ · เพลย์ลิสต์แนะนำ = เรียนรู้</p>
  <h3 id="22-ai-ทำงานอย่างไร-ไม่ลงสูตร">2.2 AI ทำงานอย่างไร (ไม่ลงสูตร)</h3>

  <ol type="1">

  <li><strong>ผ่านชั้นโครงข่าย (neural network)</strong> —
  จับแบบแผนที่ซับซ้อนขึ้น</li>
  <li><strong>ทำนายผล</strong> — คำถัดไป / ป้ายกำกับ / การกระทำ</li>
  <li><strong>เทียบกับคำตอบจริง (ตอนฝึก)</strong> — แล้วปรับภายในโมเดล</li>

  — ไม่ได้แปลว่าเข้าใจโลกแบบมนุษย์ หรือไม่เคยผิด</p>
  </blockquote>

  <h2 id="3-machine-learning-มี-3-แขนง">3. Machine Learning มี 3 แขนง</h2>
  <p>Machine Learning (ML) = การเรียนรู้ของเครื่อง<br />
  เปรียบง่าย ๆ เหมือนดนตรี: <strong>โน้ต → สเกล → อิมโพรไวส์</strong><br />
  ควรทำความเข้าใจตามลำดับ 1 → 2 → 3</p>
  <p><img src="content/images/02-three-ml-branches.svg"
  alt="สามแขนง Machine Learning" /></p>
  <h3 id="31-supervised-learning--มีครู--มีเฉลย">3.1 Supervised Learning —
  มีครู / มีเฉลย</h3>
  <ul>
  <li>ข้อมูลมาพร้อม <strong>คำตอบที่ถูก (label)</strong></li>
  <li>เหมือนติวเตอร์ให้โจทย์พร้อมเฉลย</li>
  <li>วงจรพื้นฐาน: <strong>ฝึก → ทดสอบ → ปรับปรุง</strong></li>
  </ul>
  <table>
  <thead>
  <tr>
  <th>งาน</th>
  <th>อินพุต</th>
  <th>คำตอบ (label)</th>
  </tr>
  </thead>
  <tbody>
  <tr>
  <td>กรองสแปม</td>
  <td>ข้อความอีเมล</td>
  <td>สแปม / ไม่สแปม</td>
  </tr>
  <tr>
  <td>ทำนายคะแนน</td>
  <td>ชั่วโมงอ่านหนังสือ</td>
  <td>คะแนน</td>
  </tr>
  <tr>
  <td>ดนตรี</td>
  <td>คลิปเสียงสั้น</td>
  <td>“คอร์ด C” / “ไม่ใช่”</td>
  </tr>
  </tbody>
  </table>
  <p>ถ้าคุณเคยกด like / dislike หรือ flag spam — คุณกำลังช่วยสร้าง label
  ให้ระบบแบบนี้</p>
  <h3 id="32-unsupervised-learning--ไม่มีครู--ไม่มีเฉลยล่วงหน้า">3.2 Unsupervised
  Learning — ไม่มีครู / ไม่มีเฉลยล่วงหน้า</h3>
  <ul>
  <li>ไม่มีป้ายคำตอบติดมา</li>
  <li>ระบบหา <strong>กลุ่ม / โครงสร้าง</strong> เอง</li>
  <li>เหมือนกองการ์ดที่ยังไม่ตั้งชื่อกอง แล้วจัดตามความคล้าย</li>
  </ul>
  <p><strong>ตัวอย่าง</strong></p>
  <ul>
  <li>จัดกลุ่มลูกค้าตามพฤติกรรมซื้อ</li>
  <li>จัดกลุ่มเพลงที่ “คล้ายกัน” แม้ยังไม่ติดแท็กแนว</li>
  <li>ในงานดนตรี: จัด repertoire ตามความยากหรืออารมณ์ โดยยังไม่ตั้งชื่อหมวด</li>
  </ul>
  <p><strong>จำคู่เปรียบเทียบ</strong></p>
  <blockquote>
  <p>Supervised = “นี่คือแมว”<br />
  Unsupervised = “สิ่งพวกนี้คล้ายกัน กองไว้ด้วยกัน”</p>
  </blockquote>
  <h3 id="33-reinforcement-learning--เรียนรู้จากรางวัล">3.3 Reinforcement
  Learning — เรียนรู้จากรางวัล</h3>
  <ul>
  <li>มี <strong>เอเจนต์</strong> ลงมือในสภาพแวดล้อม</li>
  <li>ได้ feedback (รางวัล / สัญญาณลบ) แล้วปรับกลยุทธ์</li>
  <li>เหมือนฝึกด้วยรางวัลทีละน้อย</li>
  </ul>
  <p><strong>ตัวอย่าง</strong></p>
  <ul>
  <li>บอทเล่นเกม: ชนะ = +คะแนน</li>
  <li>หุ่นยนต์เดิน: ล้ม = ลบ · ถึงเป้า = บวก</li>
  </ul>
  <p>แขนงนี้เข้าใจง่ายขึ้นหลังรู้สองแขนงแรก เพราะต้องรู้ก่อนว่า “วัดผล” และ “ทำนาย”
  คืออะไร</p>
  <h3 id="34-ตรวจความเข้าใจเร็ว-ๆ">3.4 ตรวจความเข้าใจเร็ว ๆ</h3>
  <p>จับคู่ให้ถูก:</p>
  <table>
  <thead>
  <tr>
  <th>สถานการณ์</th>
  <th>คำตอบ</th>
  </tr>
  </thead>
  <tbody>
  <tr>
  <td>แยกประเภทรูปแมว/หมา</td>
  <td>Supervised</td>
  </tr>
  <tr>
  <td>จัดกลุ่มผู้ฟังคอนเสิร์ตจากประวัติซื้อบัตร โดยยังไม่ตั้งชื่อกลุ่ม</td>
  <td>Unsupervised</td>
  </tr>
  <tr>
  <td>AI ฝึกยิงบาสในเกมจนได้แต้มสูงขึ้น</td>
  <td>Reinforcement</td>
  </tr>
  </tbody>
  </table>
  <hr />
  <h2 id="4-6-คำศัพท์-ai-ที่ควรรู้ก่อนใช้จริง">4. 6 คำศัพท์ AI ที่ควรรู้ก่อนใช้จริง</h2>
  <p><img src="content/images/03-six-ai-terms.svg" alt="หกคำศัพท์ AI" /></p>
  <table>
  <thead>
  <tr>
  <th>#</th>
  <th>คำอังกฤษ</th>
  <th>ภาษาคน</th>
  <th>จำหนึ่งประโยค</th>
  <th>ทำไมสำคัญกับคุณ</th>
  </tr>
  </thead>
  <tbody>
  <tr>
  <td>1</td>
  <td><strong>Hallucination</strong></td>
  <td>ตอบมั่ว / มโน</td>
  <td>มั่นใจแต่ข้อเท็จจริงผิดได้</td>
  <td>อย่าเชื่อชื่อคน ปีเพลง หรือทฤษฎีโดยไม่ตรวจ</td>
  </tr>
  <tr>
  <td>2</td>
  <td><strong>Temperature</strong></td>
  <td>อุณหภูมิการสุ่ม</td>
  <td>ปุ่ม “กล้าเดา”</td>
  <td>งานสรุปใช้ต่ำ · งานไอเดียสร้างสรรค์ใช้สูงขึ้นได้</td>
  </tr>
  <tr>
  <td>3</td>
  <td><strong>Tokens</strong></td>
  <td>โทเคน</td>
  <td>ชิ้นข้อความที่โมเดลกิน</td>
  <td>กระทบโควตา free tier และความยาวที่คุยได้</td>
  </tr>
  <tr>
  <td>4</td>
  <td><strong>Context window</strong></td>
  <td>หน้าต่างบริบท</td>
  <td>หน่วยความจำระยะสั้นของการสนทนา</td>
  <td>คุยยาวมากอาจลืมสิ่งที่บอกตอนต้น</td>
  </tr>
  <tr>
  <td>5</td>
  <td><strong>RAG</strong></td>
  <td>ค้นก่อน แล้วค่อยตอบ</td>
  <td>ไปหาเอกสารก่อนสร้างคำตอบ</td>
  <td>ลดการมโนเมื่อมีแหล่งจริง (เช่น ไฟล์ที่อัปโหลด)</td>
  </tr>
  <tr>
  <td>6</td>
  <td><strong>Embeddings</strong></td>
  <td>เวกเตอร์ความหมาย</td>
  <td>ข้อความ → ตัวเลขที่จับความใกล้เคียง</td>
  <td>พื้นฐานการค้นหา “ความหมายคล้าย”</td>
  </tr>
  </tbody>
  </table>
  <h3 id="เกมทายคำ-ฝึกเองหรือเล่นกับเพื่อน">เกมทายคำ (ฝึกเองหรือเล่นกับเพื่อน)</h3>
  <p>อ่านสถานการณ์ แล้วบอกว่าเป็นคำไหน:</p>
  <ol type="1">
  <li>แชทบอทอ้างชื่อนักแต่งเพลงที่ไม่มีตัวตน → <strong>Hallucination</strong></li>
  <li>อยากได้ไอเดียชื่อคอนเสิร์ตแหวกแนว → ลอง <strong>Temperature</strong>
  สูงขึ้น</li>
  <li>ระบบค้นจาก PDF รายวิชาก่อนตอบ → <strong>RAG</strong></li>
  <li>โมเดลลืมสเปกที่บอกไว้ตอนต้นแชทยาว → <strong>Context window</strong></li>
  </ol>
  <hr />
  <h2 id="5-ใช้-ai-อย่างไรให้มีสติ-แนวคิดจากเดโม่ในคาบ">5. ใช้ AI อย่างไรให้มีสติ
  (แนวคิดจากเดโม่ในคาบ)</h2>
  <p>ในคาบอาจารย์จะสาธิตบนจอ คุณใช้ส่วนนี้เป็น<strong>คู่มือทดลองเอง</strong>
  และทบทวนหลังคาบ</p>
  <h3 id="51-ใช้เป็นติวเตอร์เร่งด่วน--แต่คุณเป็นคนตรวจ">5.1 ใช้เป็นติวเตอร์เร่งด่วน —
  แต่คุณเป็นคนตรวจ</h3>
  <p>ลอง prompt นี้:</p>
  <pre class="text"><code>สรุปใน 3 ประโยคว่า Machine Learning ต่างจากโปรแกรมที่เขียนกฎตายตัวอย่างไร
  ใช้ภาษาที่นักเรียนมัธยมเข้าใจได้</code></pre>
  <p><strong>สิ่งที่คุณควรทำหลังได้คำตอบ</strong></p>
  <ul>
  <li>อ่านทั้งก้อน อย่าก็อปไปส่งทันที</li>
  <li>ถามตัวเอง: สรุปครบไหม? มีจุดที่ฟังดูสวยแต่ไม่แน่ใจไหม?</li>
  </ul>
  <h3 id="52-hallucination-ai-มั่นใจได้แม้ผิด">5.2 Hallucination: AI
  มั่นใจได้แม้ผิด</h3>
  <p>ลอง (หรือดูตอนสาธิต) ชื่อเพลง/งานที่<strong>ไม่มีจริง</strong>:</p>
  <pre class="text"><code>ใครเป็นผู้ประพันธ์เพลงไทยชื่อ &quot;แสงจันทร์บนดอยอินทนนท์ ฉบับปี 2499&quot;
  ตอบสั้น ๆ พร้อมปีเกิดของผู้ประพันธ์</code></pre>
  <p>จากนั้นลองตั้งกฎใน prompt:</p>
  <pre class="text"><code>ถ้าคุณไม่แน่ใจว่ามีเพลงนี้จริง ให้ตอบว่า &quot;ไม่พบข้อมูลที่ตรวจสอบได้&quot;
  อย่าเดาชื่อคนหรือปี</code></pre>
  <p><strong>บทเรียน:</strong> การตั้งกฎช่วยลดการเดาได้ แต่<strong>ไม่
  100%</strong> — งานสำคัญต้องตรวจแหล่งภายนอกเสมอ</p>
  <h3 id="53-context-window-จำได้ไม่ทั้งจักรวาล">5.3 Context window:
  จำได้ไม่ทั้งจักรวาล</h3>
  <ul>
  <li>คุยยาวมาก โมเดลอาจลืมต้นเรื่อง</li>
  <li>งานสำคัญ: สรุปสเปกเป็นข้อ ๆ · เปิดแชทใหม่เมื่อเรื่องเปลี่ยน ·
  แนบเอกสารเมื่อต้องการอ้างอิง (แนวคิดคล้าย RAG)</li>
  </ul>
  <h3 id="54-temperature--โทนคำตอบ">5.4 Temperature / โทนคำตอบ</h3>
  <p>งานเดียวกัน ขอคนละโทน:</p>
  <ul>
  <li>“ตอบแบบระมัดระวัง เป็นข้อ ๆ”</li>
  <li>“ตอบแบบสร้างสรรค์ มีไอเดียแปลกได้”</li>
  </ul>
  <p>สังเกตว่าคำตอบเปลี่ยนโทน — นั่นคือแนวคิด temperature ในภาษาคน</p>
  <h3 id="55-คำถามคิดตาม-อภิปรายหรือจดโน้ต">5.5 คำถามคิดตาม
  (อภิปรายหรือจดโน้ต)</h3>
  <ol type="1">
  <li>ในอาชีพนักดนตรี / งานสร้างสรรค์ สถานการณ์ไหนที่ hallucination
  อันตรายที่สุด?</li>
  <li>เมื่อไหร่ควรใช้ AI และเมื่อไหร่ไม่ควร?</li>
  <li>ทำไมรายวิชาถึงให้เปิดเผยการใช้ AI ในงานให้คะแนน?</li>
  </ol>

  <h2 id="11-แม่แบบเปิดเผยการใช้-ai-ใช้ตอนส่งงานให้คะแนน">11. แม่แบบเปิดเผยการใช้
  AI (ใช้ตอนส่งงานให้คะแนน)</h2>
  <p>คัดลอกแล้วเติมให้ตรงงานของคุณ:</p>
  <pre class="text"><code>บันทึกเปิดเผยการใช้ AI
  1. เครื่องมือและรุ่น/ระดับบริการที่ใช้ (ถ้าทราบ):
  2. ส่วนของงานที่ AI ช่วย:
  3. prompt สำคัญหรือสรุปกระบวนการ:
  4. สิ่งที่ฉันตรวจสอบ แก้ไข ตัดทิ้ง หรือตัดสินใจเอง:
  5. แหล่งที่ใช้ตรวจข้อเท็จจริงทางดนตรี/ลิขสิทธิ์:
  6. คำรับรอง: ข้าพเจ้าได้ตรวจผลงานฉบับส่งและรับผิดชอบการตัดสินใจในงานนี้</code></pre>
  <hr />
  <h2 id="แหล่งอ่านเพิ่ม-ไม่บังคับทั้งหมด">แหล่งอ่านเพิ่ม (ไม่บังคับทั้งหมด)</h2>
  <p>ใช้เมื่ออยากทบทวนหรือเรียนต่อ — <strong>ไม่ต้องอ่านครบในคืนเดียว</strong></p>
  <table>
  <thead>
  <tr>
  <th>หัวข้อ</th>
  <th>แหล่ง</th>
  <th>หมายเหตุ</th>
  </tr>
  </thead>
  <tbody>
  <tr>
  <td>3 แขนง ML</td>
  <td>สื่อภาพ/โพสต์แนว @free_ai_guides</td>
  <td>โครง Supervised → Unsupervised → Reinforcement</td>
  </tr>

  <h2 id="แบบฝึกในชั่วโมง--การบ้านและแบบฝึกเชื่อมสัปดาห์หน้า">แบบฝึกในชั่วโมง +
  การบ้านและแบบฝึกเชื่อมสัปดาห์หน้า</h2>
  <blockquote>
  <p>ส่วนนี้คือ<strong>งานที่ต้องลงมือ</strong> — ในคาบทำกิจกรรมตามลำดับ ·
  หลังคาบทำการบ้านและแบบฝึกเพื่อเอาไปใช้/ส่งใน<strong>สัปดาห์ 2 · วินิจฉัยการฝึก +
  multi-step prompt</strong></p>
  </blockquote>
  <h2 id="แบบฝึกในชั่วโมง-in-class">แบบฝึกในชั่วโมง (In-class)</h2>
  <h3 id="กิจกรรม-a--อุ่นเครื่อง-510-นาที">กิจกรรม A · อุ่นเครื่อง (5–10 นาที)</h3>
  <p>ตอบในโน้ตหรือแชร์ปากเปล่า 1 ประโยค:</p>
  <ol type="1">
  <li>เคยใช้ AI ทำอะไรมาแล้วบ้าง?</li>
  <li>สิ่งที่ยังงงที่สุดเกี่ยวกับ AI คืออะไร?</li>
  </ol>
  <h3 id="กิจกรรม-b--แยก-กฎ-กับ-เรียนรู้จากข้อมูล-10-นาที">กิจกรรม B · แยก “กฎ” กับ
  “เรียนรู้จากข้อมูล” (10 นาที)</h3>
  <p>จับคู่หรือคนเดียว — เขียนอย่างละ 2 ตัวอย่างจากชีวิต/ดนตรี:</p>
  <table>
  <thead>
  <tr>
  <th>กฎที่คนเขียน</th>
  <th>เรียนรู้จากข้อมูล</th>
  </tr>
  </thead>
  <tbody>
  <tr>
  <td>1.</td>
  <td>1.</td>
  </tr>
  <tr>
  <td>2.</td>
  <td>2.</td>
  </tr>
  </tbody>
  </table>
  <h3 id="กิจกรรม-c--3-แขนง-ml--เกมสถานการณ์-10-นาที">กิจกรรม C · 3 แขนง ML —
  เกมสถานการณ์ (10 นาที)</h3>
  <p>เขียนหมายเลข 1=Supervised 2=Unsupervised 3=Reinforcement:</p>
  <ul>
  <li>( ) แอปจัดกลุ่มเพลย์ลิสต์ที่ “คล้ายกัน” โดยไม่มีแท็กแนว</li>
  <li>( ) แยกอีเมลสแปม/ไม่สแปม</li>
  <li>( ) บอทเกมเล่นแล้วได้คะแนนจนเก่งขึ้น</li>
  <li>( ) ทำนายว่าโน้ตช่วงนี้ยาก/ง่ายจากสถิติการซ้อมเก่าที่มี label</li>
  </ul>
  <h3 id="กิจกรรม-d--เกม-6-คำศัพท์-10-นาที">กิจกรรม D · เกม 6 คำศัพท์ (10
  นาที)</h3>
  <p>เพื่อนอ่านสถานการณ์ — คุณตะโกน/เขียนคำศัพท์:</p>
  <ol type="1">
  <li>AI แต่งชื่อนักประพันธ์ที่ไม่มีจริง → ________</li>
  <li>อยากได้ไอเดียชื่อคอนเสิร์ตแหวก → ปรับ ________</li>
  <li>คุยยาวแล้ว AI ลืมต้นเรื่อง → ________</li>
  <li>ระบบค้น PDF รายวิชาก่อนตอบ → ________</li>
  </ol>
  <h3 id="กิจกรรม-e--prompt-lab-1520-นาที--ส่งในชั่วโมงได้">กิจกรรม E · Prompt
  lab (15–20 นาที) — ส่งในชั่วโมงได้</h3>
  <p>ใช้บัญชี free tier วาง prompt:</p>
  <pre class="text"><code>คุณเป็นติวเตอร์อธิบาย AI ให้มือใหม่
  1) อธิบาย Supervised Learning ด้วยตัวอย่างชีวิตประจำวัน 1 อย่าง
  2) เตือนเรื่อง hallucination ใน 2 ประโยค
  3) ถามฉัน 1 คำถามเพื่อตรวจว่าเข้าใจหรือยัง
  ใช้ภาษาไทย กระชับ</code></pre>
  <p><strong>ส่งท้ายชั่วโมง (ติ๊ก):</strong></p>
  <ul class="task-list">
  <li><p><label><input type="checkbox" />ได้คำตอบจาก AI 1
  รอบ</label></p></li>
  <li><p><label><input type="checkbox" />เขียน 1 บรรทัด: “จุดที่ฉันยังไม่เชื่อ AI คือ
  …”</label></p></li>
  <li><p><label><input type="checkbox" />ถ้าเวลาพอ: แก้ prompt รอบ
  2</label></p></li>
  </ul>
  <h2
  id="การบ้านและแบบฝึก--research--เตรียมสัปดาห์-2--วินิจฉัยการฝึก--multi-step-prompt">การบ้านและแบบฝึก
  / Research · เตรียมสัปดาห์ 2 · วินิจฉัยการฝึก + multi-step prompt</h2>
  <h3 id="งานบังคับ-ทุกคน--เตรียมสัปดาห์-2">งานบังคับ (ทุกคน) — เตรียมสัปดาห์ 2</h3>
  <p>ใช้เวลาประมาณ <strong>25–40 นาที</strong> รวมกัน</p>
  <ol type="1">
  <li><strong>บัญชี AI พร้อมใช้</strong>
  <ul>
  <li>สมัคร/ล็อกอิน Gemini, Claude, GPT หรือ Grok (free tier) อย่างน้อย 1 ตัว</li>
  <li>ทดสอบถาม 1 คำถามสั้น ๆ ว่าใช้งานได้</li>
  </ul>
  <ul class="task-list">
  <li><label><input type="checkbox" />ทำแล้ว</label></li>
  </ul></li>
  <li><strong>โน้ต “ปัญหาการซ้อมของฉัน” แบบหยาบ (ยังไม่ต้องสวย)</strong><br />
  เขียนภาษาไทย 5–8 บรรทัด เตรียมมาใช้ในคาบหน้า:
  <pre class="text"><code>เครื่อง/เสียง:
  เพลงหรือแบบฝึกหลักตอนนี้:
  จุดที่ติดบ่อยที่สุด (ห้อง/ท่อน/เทคนิค):
  เวลาซ้อมที่มีจริงต่อวันโดยประมาณ:
  สิ่งที่เคยลองแก้แล้ว:</code></pre>
  <ul class="task-list">
  <li><label><input type="checkbox" />เขียนแล้ว ·
  เก็บในโฟลเดอร์รายวิชา</label></li>
  </ul></li>
  <li><strong>ทบทวน 6 คำศัพท์</strong> จากบัตรท้ายบทที่ 1 (Hallucination …
  Embeddings)
  <ul class="task-list">
  <li><label><input type="checkbox" />อ่านซ้ำ 10 นาที</label></li>
  </ul></li>
  <li><strong>อ่านแม่แบบ disclosure</strong> (ท้ายบทที่ 1) รู้ว่ามี 6 ข้อ
  <ul class="task-list">
  <li><label><input type="checkbox" />เปิดดูแล้ว</label></li>
  </ul></li>
  </ol>
