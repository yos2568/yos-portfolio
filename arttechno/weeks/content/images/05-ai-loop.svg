<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 280" role="img" aria-labelledby="t5 d5">
  <title id="t5">AI ทำงานอย่างไรแบบง่าย</title>
  <desc id="d5">หกขั้นจากข้อมูลเข้าถึงการทำนาย</desc>
  <rect width="920" height="280" rx="24" fill="#141d27"/>
  <text x="460" y="40" text-anchor="middle" fill="#f0e6d0" font-family="Noto Sans Thai, Leelawadee UI, Tahoma, sans-serif" font-size="20" font-weight="700">AI ทำงานอย่างไร (แบบไม่ลงสูตร)</text>

  <!-- steps as connected pills -->
  <g font-family="Noto Sans Thai, Leelawadee UI, Tahoma, sans-serif">
    <rect x="24" y="90" width="130" height="100" rx="14" fill="#176f8a"/>
    <text x="89" y="128" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">1</text>
    <text x="89" y="152" text-anchor="middle" fill="#fff" font-size="13">รับข้อมูล</text>
    <text x="89" y="172" text-anchor="middle" fill="#d6eef5" font-size="11">ข้อความ/ภาพ</text>

    <path d="M158 140 L172 140" stroke="#7ec8dc" stroke-width="2"/>
    <polygon points="172,134 184,140 172,146" fill="#7ec8dc"/>

    <rect x="188" y="90" width="130" height="100" rx="14" fill="#1f7f9a"/>
    <text x="253" y="128" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">2</text>
    <text x="253" y="152" text-anchor="middle" fill="#fff" font-size="13">แปลงเป็นตัวเลข</text>
    <text x="253" y="172" text-anchor="middle" fill="#d6eef5" font-size="11">ที่โมเดลใช้ได้</text>

    <path d="M322 140 L336 140" stroke="#7ec8dc" stroke-width="2"/>
    <polygon points="336,134 348,140 336,146" fill="#7ec8dc"/>

    <rect x="352" y="90" width="130" height="100" rx="14" fill="#2a8fa8"/>
    <text x="417" y="128" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">3</text>
    <text x="417" y="152" text-anchor="middle" fill="#fff" font-size="13">ผ่านชั้นโครงข่าย</text>
    <text x="417" y="172" text-anchor="middle" fill="#d6eef5" font-size="11">จับแบบแผน</text>

    <path d="M486 140 L500 140" stroke="#7ec8dc" stroke-width="2"/>
    <polygon points="500,134 512,140 500,146" fill="#7ec8dc"/>

    <rect x="516" y="90" width="130" height="100" rx="14" fill="#9b6b16"/>
    <text x="581" y="128" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">4</text>
    <text x="581" y="152" text-anchor="middle" fill="#fff" font-size="13">ทำนายผล</text>
    <text x="581" y="172" text-anchor="middle" fill="#f5e6c8" font-size="11">คำ/ป้าย/การกระทำ</text>

    <path d="M650 140 L664 140" stroke="#e8c27a" stroke-width="2"/>
    <polygon points="664,134 676,140 664,146" fill="#e8c27a"/>

    <rect x="680" y="90" width="100" height="100" rx="14" fill="#b8841f"/>
    <text x="730" y="128" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">5</text>
    <text x="730" y="152" text-anchor="middle" fill="#fff" font-size="12">เทียบเฉลย</text>
    <text x="730" y="172" text-anchor="middle" fill="#f5e6c8" font-size="11">(ตอนฝึก)</text>

    <path d="M784 140 L798 140" stroke="#e8c27a" stroke-width="2"/>
    <polygon points="798,134 810,140 798,146" fill="#e8c27a"/>

    <rect x="814" y="90" width="86" height="100" rx="14" fill="#0b1118" stroke="#7ec8dc" stroke-width="1.5"/>
    <text x="857" y="128" text-anchor="middle" fill="#7ec8dc" font-size="13" font-weight="700">6</text>
    <text x="857" y="152" text-anchor="middle" fill="#fff" font-size="12">ใช้ทำนาย</text>
    <text x="857" y="172" text-anchor="middle" fill="#8aa0b2" font-size="11">ของใหม่</text>
  </g>

  <text x="460" y="240" text-anchor="middle" fill="#8aa0b2" font-family="Noto Sans Thai, Leelawadee UI, Tahoma, sans-serif" font-size="13">จำไว้: เก่งเรื่องแบบแผนจากข้อมูล — ไม่ได้แปลว่าเข้าใจโลกแบบมนุษย์เสมอ</text>
</svg>
